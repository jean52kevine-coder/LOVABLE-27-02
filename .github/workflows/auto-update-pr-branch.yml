name: Auto update PR branch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-branch:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-update PR branch with base branch
        uses: peter-evans/update-branch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          update-method: merge
